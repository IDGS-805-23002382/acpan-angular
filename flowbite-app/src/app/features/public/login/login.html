<!-- SECCIÓN DE LOGIN -->
<section class="flex min-h-[calc(100vh-4rem)] items-center justify-center bg-white px-4 py-12">
  <div class="w-full max-w-4xl grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">

    <!-- Columna Izquierda: Formulario -->
    <div class="lg:col-span-6 space-y-6 px-4">

      <!-- Encabezado -->
      <div>
        <h1 class="text-4xl font-extrabold text-[#2A114B] tracking-tight">¡Bienvenido!</h1>
        <p class="mt-1 text-sm text-gray-400">Inicia sesión con tu correo</p>
      </div>

      <!-- Formulario -->
      <form class="space-y-5" (ngSubmit)="$event.preventDefault(); ingresar()">

        @if (errorMessage()) {
        <div
          class="rounded-xl bg-red-50 border border-red-200 p-4 text-sm text-red-600 flex items-start gap-3 transition-all">
          <svg class="w-5 h-5 text-red-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
          <div class="flex flex-col">
            <span>{{ errorMessage() }}</span>
            <span class="text-xs text-red-500 mt-1">Si crees que se trata de un error, por favor contacta al
              administrador.</span>
          </div>
        </div>
        }

        <div>
          <label class="block text-sm font-bold text-gray-900 mb-2">Usuario (Correo)</label>
          <input required type="email" [ngModel]="correo()" (ngModelChange)="correo.set($event)" name="correo"
            placeholder="correo@ejemplo.com"
            class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-sm text-gray-900 focus:border-[#9B51E0] focus:ring-1 focus:ring-[#9B51E0] outline-none transition-all shadow-xs" />
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-900 mb-2">Contraseña</label>
          <div class="relative flex items-center">
            <input required [type]="mostrarPassword() ? 'text' : 'password'" [ngModel]="password()"
              (ngModelChange)="password.set($event)" name="password" placeholder="••••••••"
              class="w-full rounded-l-xl border border-r-0 border-gray-300 bg-white px-4 py-3 text-sm text-gray-900 focus:border-[#9B51E0] focus:ring-1 focus:ring-[#9B51E0] outline-none transition-all shadow-xs" />

            <!-- Botón del ojito para mostrar/ocultar contraseña -->
            <button type="button" (click)="togglePassword()"
              class="flex items-center justify-center px-4 py-3 bg-[#9B51E0] text-white rounded-r-xl border border-[#9B51E0] hover:bg-[#863ec9] transition-colors">
              @if (mostrarPassword()) {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.05 10.05 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M3 3l18 18" />
              </svg>
              } @else {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
              }
            </button>
          </div>
        </div>

        <!-- Botón de Iniciar Sesión (Se bloquea si los campos están vacíos) -->
        <button type="submit" [disabled]="!correo() || !password() || cargando()"
          class="w-full rounded-xl bg-[#9B51E0] px-4 py-3 text-sm font-bold text-white shadow-md transition-all hover:bg-[#863ec9] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
          @if (cargando()) {
          <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
            viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
          <span>Verificando...</span>
          } @else {
          <span>Iniciar Sesión</span>
          }
        </button>

      </form>

    </div>


    <div class="lg:col-span-6 hidden lg:flex relative overflow-hidden">
      <svg width="606" height="802" viewBox="0 0 606 802" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="606" height="802" rx="38" fill="url(#paint0_linear_0_1)" />
        <defs>
          <linearGradient id="paint0_linear_0_1" x1="303" y1="0" x2="303" y2="802" gradientUnits="userSpaceOnUse">
            <stop stop-color="#9A63A0" />
            <stop offset="1" stop-color="#321047" />
          </linearGradient>
        </defs>
      </svg>
    </div>

  </div>
</section>
