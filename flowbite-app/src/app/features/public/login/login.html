<!-- SECCIÓN DE LOGIN (IDÉNTICA A LA IMAGEN DE REFERENCIA) -->
<section class="flex min-h-[calc(100vh-4rem)] items-center justify-center bg-white px-4 py-12">
  <div class="w-full max-w-4xl grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
    
    <!-- Columna Izquierda: Formulario -->
    <div class="lg:col-span-6 space-y-6 px-4">
      
      <!-- Encabezado -->
      <div>
        <h1 class="text-4xl font-extrabold text-[#2A114B] tracking-tight">¡Bienvenido!</h1>
        <p class="mt-1 text-sm text-gray-400">Inicia sesión con tu correo</p>
      </div>

      <!-- Formulario -->
      <form class="space-y-5" (ngSubmit)="ingresar()">
        
        <div>
          <label class="block text-sm font-bold text-gray-900 mb-2">Usuario</label>
          <input required type="text" [ngModel]="correo()" (ngModelChange)="correo.set($event)" name="correo"
                 class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-sm text-gray-900 focus:border-[#9B51E0] focus:ring-1 focus:ring-[#9B51E0] outline-none transition-all shadow-xs" />
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-900 mb-2">Contraseña</label>
          <div class="relative flex items-center">
            <input required type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" name="password"
                   class="w-full rounded-l-xl border border-r-0 border-gray-300 bg-white px-4 py-3 text-sm text-gray-900 focus:border-[#9B51E0] focus:ring-1 focus:ring-[#9B51E0] outline-none transition-all shadow-xs" />
            <button type="button" class="flex items-center justify-center px-4 py-3 bg-[#9B51E0] text-white rounded-r-xl border border-[#9B51E0] hover:bg-[#863ec9] transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Separador "Ó si lo prefieres" -->
        <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t border-gray-300"></div>
          <span class="flex-shrink mx-4 text-xs font-medium text-[#9B51E0]">Ó si lo prefieres</span>
          <div class="flex-grow border-t border-gray-300"></div>
        </div>

        <!-- Botón Login con Google -->
        <button type="button" class="w-full flex items-center justify-center gap-3 rounded-xl border border-gray-300 bg-white py-3 text-sm font-semibold text-gray-700 shadow-xs hover:bg-gray-50 transition-all">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.745 12.27c-.07-.7-.6-1.27-1.34-1.27H12v4.5h6.5c-.28 1.48-1.54 3-3.5 3-2.11 0-3.83-1.72-3.83-3.83s1.72-3.83 3.83-3.83c1.02 0 1.93.38 2.62 1l3.35-3.35c-1.2-1.12-2.8-1.8-4.97-1.8-4.31 0-7.83 3.52-7.83 7.83s3.52 7.83 7.83 7.83c4.52 0 7.5-3.18 7.5-7.65 0-.52-.05-1.02-.15-1.46z"/>
            <path fill="#34A853" d="M12 20c2.16 0 4.07-.75 5.43-2.02l-2.7-2.17c-.74.5-1.68.8-2.73.8-2.11 0-3.83-1.72-3.83-3.83 0-.48.09-.94.25-1.37L5.6 9.98C5.22 10.82 5 11.75 5 12.75 5 16.76 8.24 20 12 20z"/>
            <path fill="#FBBC05" d="M8.17 11.23c-.11-.38-.17-.78-.17-1.23 0-.45.06-.85.17-1.23L5.6 6.41C4.98 7.68 4.63 9.15 4.63 10.75s.35 3.07.97 4.34l2.57-2.86z"/>
            <path fill="#EA4335" d="M12 7.17c1.18 0 2.24.41 3.08 1.21l2.31-2.31C16.07 4.75 14.16 4 12 4 8.24 4 5 7.24 5 11c0 .48.05.94.15 1.41l2.57-2.02C8.17 8.57 9.91 7.17 12 7.17z"/>
          </svg>
          Login with Google
        </button>

      </form>

      <!-- Pie de texto / Registro -->
      <div class="pt-2">
        <p class="text-xs text-gray-500">
          ¿Aún sin cuenta?, <a routerLink="/contacto" class="font-bold text-[#9B51E0] hover:underline">Regístrate aquí</a>
        </p>
      </div>

    </div>

    <!-- Columna Derecha: Tarjeta Morada Estilizada -->
    <div class="lg:col-span-6 hidden lg:flex  relative overflow-hidden">
